# Copy to .github/workflows/skill-scan.yml in any repo that contains skills or agent files.
# Scans every folder with a SKILL.md, plus agents/ and hooks/, with SkillSpector (static, no LLM).
#
# Accepted findings: if .skillspector-baseline.yaml exists at the repo root, it is passed with
# --baseline, so reviewed false positives (each with a written reason) stop failing the build
# while any NEW finding still does. Generate it locally with:
#   skillspector baseline <path> --no-llm -o .skillspector-baseline.yaml
# and review every entry before committing it.
name: skill-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Install SkillSpector
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git
      - name: Scan
        run: |
          set -uo pipefail
          mkdir -p reports
          baseline=()
          if [ -f .skillspector-baseline.yaml ]; then baseline=(--baseline .skillspector-baseline.yaml); fi
          targets=$(find . -name SKILL.md -not -path './.git/*' -exec dirname {} \; | sort -u)
          for d in agents hooks; do [ -d "$d" ] && targets="$targets ./$d"; done
          failed=0
          for t in $targets; do
            name=$(echo "$t" | tr '/.' '__')
            report="reports/$name.json"
            echo "::group::$t"
            skillspector scan "$t" --no-llm "${baseline[@]}" --format json --output "$report"
            code=$?
            python3 - "$report" "$t" <<'PY'
          import json, sys
          path, target = sys.argv[1], sys.argv[2]
          try:
              r = json.load(open(path))
          except Exception as exc:
              print(f"{target}: no report ({exc})"); sys.exit(0)
          risk = r.get("risk_assessment") or {}
          print(f"{target}: risk_score={risk.get('score')} recommendation={risk.get('recommendation')} "
                f"suppressed={r.get('suppressed_count', 0)}")
          for f in r.get("issues", []):
              loc = f.get("location") or {}
              print(f"  [{f.get('severity')}] {f.get('id')} {loc.get('file')}:{loc.get('start_line')} - "
                    f"{f.get('pattern')} | match: {(f.get('finding') or '')[:80]}")
          PY
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::SkillSpector failed for $t (exit $code). See the findings above."
              failed=1
            fi
          done
          exit $failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: skillspector-reports
          path: reports/
